# Optional: Render → Blueprints → New Blueprint Instance → select repo (uses this file).
services:
  - type: web
    name: howtowin-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
